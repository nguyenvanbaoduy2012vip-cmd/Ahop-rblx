order-radius:24px;padding:22px}.modal-head{display:flex;align-items:center;gap:10px}.modal-head h2{margin:0;flex:1}input,textarea,select{width:100%;padding:12px;border:1px solid #dfcaca;border-radius:12px;outline:none;background:#fff;margin-top:6px}input:focus,textarea:focus,select:focus{border-color:#c71919}.field{margin:12px 0}.field label{font-weight:700;font-size:14px}.close{background:#f5eeee;padding:8px 12px;border-radius:50%}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tabs button{white-space:nowrap;background:#fff;border:1px solid #ead5d5;padding:10px 15px;border-radius:999px}.tabs button.active{background:#c71919;color:#fff}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.balance{font-weight:900;color:#c71919}.admin-item{padding:13px;border:1px solid #eddede;border-radius:15px;margin:9px 0;background:#fff}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#f8eaea;font-size:12px;font-weight:700}.success{background:#e8f8ed;color:#18733b}.danger{background:#fde7e7;color:#a90000}.warn{background:#fff4d9;color:#8b5a00}.result{background:#fff5f5;border:1px solid #efcaca;border-radius:18px;padding:18px;margin-top:15px}.credential{word-break:break-all;background:#fff;padding:10px;border-radius:10px;border:1px solid #eee;margin:6px 0}.hidden{display:none!important}.small{font-size:13px}#toast{position:fixed;right:16px;bottom:16px;z-index:120;display:flex;flex-direction:column;gap:9px}.toast{background:#241b1b;color:#fff;padding:13px 16px;border-radius:14px;box-shadow:0 10px 30px #0003}.toast.danger{background:#a90000}.toast.success{background:#18733b}.closed{padding:45px 20px;text-align:center;background:#fff;border:2px solid #efbcbc;border-radius:24px;box-shadow:0 12px 35px #90000010}.closed h1{font-size:34px;margin:0 0 10px;color:#b00000}.zalo-logo{width:24px;height:24px;border-radius:7px;object-fit:cover;vertical-align:middle}.qr{display:block;width:min(320px,90%);margin:15px auto;border-radius:18px}.switch{display:flex;gap:8px;align-items:center}.switch input{width:auto;margin:0}@media(max-width:650px){.hero h1{font-size:27px}.grid{grid-template-columns:1fr 1fr}.card img{height:120px}.nav{gap:6px}.nav button{padding:8px 10px}}

<body>
<header><div class="nav"><div class="logo" onclick="showSection('shop')"><img id="customLogo" alt="Logo"><span id="logoText">BD <b style="color:#222">ROBLOX SHOP</b></span></div><a class="nav-link" href="index.html">Shop</a><a class="nav-link" href="mua-acc.html">🎮 Mua acc</a><a class="nav-link" href="dat-don.html">🧾 Đặt đơn</a><a class="nav-link" href="nap-tien.html">💳 Nạp thẻ</a><a class="nav-link" href="vong-quay.html">🎡 Vòng quay</a><a class="nav-link" href="rut-kim-cuong.html">💎 Kim cương</a><a class="nav-link" href="rut-robux.html">🪙 Robux</a><a class="nav-link" href="account.html">👤 Tài khoản</a><button title="Zalo" onclick="openZalo()"><img class="zalo-logo" src="https://img.icons8.com/bubbles/1200/zalo.jpg" alt="Zalo"></button><span id="userArea"></span></div></header>
<main class="container"><section id="shop"><div id="siteHero" class="hero"><h1 id="heroTitle">🎁 BD Roblox Shop</h1><p>Xé túi mù • Nhận acc ngẫu nhiên • Dữ liệu đồng bộ nhiều thiết bị</p></div><div id="closedBox" class="closed hidden"></div>
<div id="categories" class="grid"><div class="empty">⏳ Đang tải Shop...</div></div>
<div style="margin:30px 0 12px"><h2 style="margin:0 0 5px">🧾 Đặt đơn</h2><p class="muted" style="margin:0">Chọn dịch vụ, xem gói giá rồi đặt đơn.</p></div>
<div id="serviceCategories" class="grid"><div class="empty">⏳ Đang tải dịch vụ...</div></div>
</section><section id="admin" class="hidden"></section></main>
<div id="modal" class="modal"><div class="modal-box" id="modalBox"></div></div><div id="toast"></div>
<script>
const SUPABASE_URL="https://rnbjhfnjyxfpskdszdwi.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_JRRtyQgA8xEuR3skPoigDA_Jo-68s-L";
let sb=null,currentUser=null,currentProfile=null,siteSettings=null;
const money=n=>new Intl.NumberFormat("vi-VN").format(Number(n)||0)+"đ";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
function toast(msg,type=""){let d=document.createElement("div");d.className="toast "+type;d.textContent=msg;document.querySelector("#toast").appendChild(d);setTimeout(()=>d.remove(),3200)}
function openModal(html){document.querySelector("#modalBox").innerHTML=html;document.querySelector("#modal").classList.add("show")}
function closeModal(){document.querySelector("#modal").classList.remove("show")}
function initClient(){sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);return true}
function showSection(x){document.querySelector("#shop").classList.toggle("hidden",x!=="shop");document.querySelector("#admin").classList.add("hidden");if(x==="shop"){loadCategories();loadServiceCategories()}}
function authButtons(){let a=document.querySelector("#userArea");if(!currentUser){a.innerHTML=`<button onclick="openAuth('login')">Đăng nhập</button><button class="primary" onclick="openAuth('register')">Đăng ký</button>`;return}a.innerHTML=`<button onclick="openProfile()">👤 ${esc(currentProfile?.username||"Tài khoản")} · ${money(currentProfile?.balance||0)}</button><button onclick="signOut()">Thoát</button>${currentProfile?.role==="admin"?`<button class="primary" onclick="openAdmin()">⚙ Admin</button>`:""}`}
async function loadServiceCategories(){
 if(!sb)return;
 let {data,error}=await sb.from("bd_shop_order_categories").select("*").eq("active",true).order("created_at",{ascending:false});
 let box=document.querySelector("#serviceCategories");
 if(!box)return;
 if(error){box.innerHTML=`<div class="empty">Không tải được dịch vụ: ${esc(error.message)}</div>`;return}
 if(!data?.length){box.innerHTML=`<div class="empty">Chưa có dịch vụ đặt đơn.</div>`;return}
 box.innerHTML=data.map(c=>`<article class="card">${c.image_url?`<img src="${esc(c.image_url)}" alt="">`:`<div style="height:155px;background:#f7eaea;display:grid;place-items:center;font-size:45px">🧾</div>`}<div class="card-body"><h3>${esc(c.name)}</h3><p class="muted">${esc(c.description||"")}</p><div class="actions"><button class="primary" onclick="viewServiceCategory('${c.id}')">Xem chi tiết</button></div></div></article>`).join("");
}
async function viewServiceCategory(id){
 let {data:c,error}=await sb.from("bd_shop_order_categories").select("*").eq("id",id).single();
 if(error)return toast(error.message,"danger");
 let {data:pkgs,error:pe}=await sb.from("bd_shop_order_packages").select("*").eq("category_id",id).eq("active",true).order("price");
 if(pe)return toast(pe.message,"danger");
 openModal(`<div class="modal-head"><h2>🧾 ${esc(c.name)}</h2><button class="close" onclick="closeModal()">×</button></div><p>${esc(c.description||"")}</p><h3>Các gói</h3>${pkgs?.length?pkgs.map(x=>`<div class="admin-item"><div class="row"><div><b>${esc(x.name)}</b><br><span class="price">${money(x.price)}</span></div><button class="primary" onclick="openServiceOrder('${c.id}','${x.id}')">Đặt đơn</button></div></div>`).join(""):"<p class='muted'>Chưa có gói nào.</p>"}`);
}
function openServiceOrder(categoryId,packageId){
 openModal(`<div class="modal-head"><h2>🧾 Đặt đơn</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Tài Khoản Của Bạn</label><input id="soAccount" placeholder="Nhập tài khoản của bạn"></div><div class="field"><label>Mk của bạn</label><input id="soPassword" type="password" placeholder="Nhập mật khẩu của bạn"></div><div class="field"><label>Ghi chú</label><textarea id="soContent" placeholder="Nhập ghi chú"></textarea></div><button class="primary" style="width:100%;padding:13px;border-radius:12px" onclick="submitServiceOrder('${categoryId}','${packageId}')">Đặt đơn</button>`);
}
async function submitServiceOrder(categoryId,packageId){
 if(!currentUser)return openAuth("login");
 let account=document.querySelector("#soAccount").value.trim(),password=document.querySelector("#soPassword").value,content=document.querySelector("#soContent").value.trim();
 if(!account||!password)return toast("Nhập tài khoản và mật khẩu","danger");
 let {error}=await sb.rpc("bd_shop_create_service_order",{p_package_id:packageId,p_account:account,p_password:password,p_content:content||null});
 if(error)return toast(error.message,"danger");
 closeModal();toast("Đặt đơn thành công 🎉","success");await refreshUser();
}
async function openServiceOrders(){
 if(!currentUser)return openAuth("login");
 let {data,error}=await sb.rpc("bd_shop_my_service_orders");
 if(error)return toast(error.message,"danger");
 const st={pending:["Đang duyệt (Pending)","warn"],processing:["Đang làm (Processing)","warn"],completed:["Hoàn thành (Completed)","success"],cancelled:["Đã hủy (Cancelled)","danger"]};
 openModal(`<div class="modal-head"><h2>🧾 Các đơn hàng</h2><button class="close" onclick="closeModal()">×</button></div>${data?.length?data.map(o=>{let q=st[o.status]||[o.status,""];return `<div class="admin-item"><b>${esc(o.category_name||"Dịch vụ")}</b>${o.package_name?` · ${esc(o.package_name)}`:""}<br>TK: <code>${esc(o.account)}</code><br>MK: <code>${esc(o.password)}</code><br>Giá: <span class="price">${money(o.amount)}</span><br><span class="status ${q[1]}">${q[0]}</span>${o.admin_note?`<br><span class="muted">${esc(o.admin_note)}</span>`:""}<br><span class="small muted">${new Date(o.created_at).toLocaleString("vi-VN")}</span></div>`}).join(""):"<p class='muted'>Chưa có đơn hàng.</p>"}`);
}
async function loadSiteSettings(){if(!sb)return;let {data,error}=await sb.from("bd_shop_settings").select("*").eq("id",1).single();siteSettings=(error||!data)?{is_closed:false,message:"Website đang tạm đóng."}:data;renderSiteState()}
function renderSiteState(){applySiteConfig();let closed=!!siteSettings?.is_closed&&!currentProfile?.role==="admin";closed=!!siteSettings?.is_closed&&currentProfile?.role!=="admin";document.querySelector("#categories").classList.toggle("hidden",closed);document.querySelector("#siteHero").classList.toggle("hidden",closed);let b=document.querySelector("#closedBox");b.classList.toggle("hidden",!closed);if(closed)b.innerHTML=`<h1>🔒 Website đang đóng</h1><p>${esc(siteSettings.message)}</p><p class="muted">Vui lòng quay lại sau.</p>`}
async function refreshUser(){
 if(!sb)return;
 let {data:{user}}=await sb.auth.getUser();
 currentUser=user||null;
 currentProfile=null;
 authButtons();
 const jobs=[loadCategories(),loadServiceCategories(),loadSiteSettings()];
 if(user){
   jobs.push(sb.from("bd_shop_profiles").select("*").eq("id",user.id).single().then(r=>{
     currentProfile=r.data||null;
     authButtons();
     renderSiteState();
     if(currentProfile?.banned_until&&new Date(currentProfile.banned_until)>new Date())showBan();
   }));
 }
 await Promise.all(jobs);
 authButtons();
 renderSiteState();
 if(currentProfile?.banned_until&&new Date(currentProfile.banned_until)>new Date())showBan();
}
async function signOut(){await sb.auth.signOut();currentUser=null;currentProfile=null;authButtons();toast("Đã đăng xuất")}
function openAuth(mode="login"){openModal(`<div class="modal-head"><h2>${mode==="login"?"Đăng nhập":"Tạo tài khoản"}</h2><button class="close" onclick="closeModal()">×</button></div>${mode==="register"?`<div class="field"><label>Tên tài khoản</label><input id="authUser" placeholder="Tên hiển thị"></div>`:""}<div class="field"><label>Email</label><input id="authEmail" type="email" placeholder="email@example.com"></div><div class="field"><label>Mật khẩu</label><input id="authPass" type="password" placeholder="Ít nhất 6 ký tự"></div><button class="primary" style="width:100%;padding:13px;border-radius:13px" onclick="${mode==="login"?"login()":"register()"}">${mode==="login"?"Đăng nhập":"Đăng ký"}</button>`)}
async function register(){let username=document.querySelector("#authUser").value.trim(),email=document.querySelector("#authEmail").value.trim(),password=document.querySelector("#authPass").value;if(!username||!email||password.length<6)return toast("Nhập đủ thông tin, mật khẩu ít nhất 6 ký tự","danger");let {data,error}=await sb.auth.signUp({email,password,options:{data:{username,bd_shop:"true"}}});if(error)return toast(error.message,"danger");closeModal();toast(data.session?"Đăng ký thành công":"Đăng ký thành công, kiểm tra email nếu Supabase đang bật xác minh","success");await refreshUser()}
async function login(){let email=document.querySelector("#authEmail").value.trim(),password=document.querySelector("#authPass").value;let {error}=await sb.auth.signInWithPassword({email,password});if(error)return toast(error.message,"danger");let {data:{user}}=await sb.auth.getUser();let p=await sb.from("bd_shop_profiles").select("id").eq("id",user.id).maybeSingle();if(!p.data)return sb.auth.signOut().then(()=>toast("Tài khoản này chưa đăng ký trên BD Roblox Shop mới.","danger"));closeModal();await refreshUser();toast("Đăng nhập thành công","success")}
function showBan(){let until=new Date(currentProfile.banned_until);openModal(`<div class="modal-head"><h2>🚫 Tài Khoản Đã Bị Khóa</h2></div><div class="result"><h3>${esc(currentProfile.ban_message||"Tài khoản đã bị khóa.")}</h3><p>Thời gian còn lại: <b id="countdown"></b></p></div>`);let timer=setInterval(()=>{let s=Math.max(0,until-new Date()),t=Math.floor(s/1000),d=Math.floor(t/86400);t%=86400;let h=Math.floor(t/3600);t%=3600;let m=Math.floor(t/60),sec=t%60,el=document.querySelector("#countdown");if(el)el.textContent=`${d} ngày ${h} giờ ${m} phút ${sec} giây`;if(!s){clearInterval(timer);closeModal();refreshUser()}},1000)}
async function loadCategories(){if(!sb)return;let {data,error}=await sb.from("bd_shop_categories").select("*").eq("active",true).order("created_at",{ascending:false});let box=document.querySelector("#categories");if(error){box.innerHTML=`<div class="empty">Không tải được danh mục: ${esc(error.message)}</div>`;return}if(!data?.length){box.innerHTML=`<div class="empty">Chưa có danh mục nào.</div>`;return}box.innerHTML=data.map(c=>`<article class="card">${c.image_url?`<img src="${esc(c.image_url)}" alt="">`:`<div style="height:155px;background:#f7eaea;display:grid;place-items:center;font-size:45px">🎁</div>`}<div class="card-body"><h3>${esc(c.name)}</h3><div class="price">${money(c.price)}</div><p class="muted">${esc(c.note||"")}</p><div class="actions"><button class="primary" onclick="openBag('${c.id}')">🎁 Xé túi</button></div></div></article>`).join("")}
async function copyCredential(value){
  value=String(value??'');
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(value);
      toast('Đã sao chép','success');
      return;
    }
  }catch(e){}
  try{
    const ta=document.createElement('textarea');
    ta.value=value;
    ta.setAttribute('readonly','');
    ta.style.position='fixed';
    ta.style.left='-9999px';
    ta.style.top='0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0,ta.value.length);
    const ok=document.execCommand('copy');
    ta.remove();
    if(ok){toast('Đã sao chép','success');return;}
  }catch(e){}
  toast('Không thể sao chép. Hãy nhấn giữ để sao chép.','danger');
}
function togglePassword(btn){
  const el=btn.closest('.cred-row').querySelector('.password-text');
  if(!el)return;
  const hidden=el.classList.toggle('is-hidden');
  el.textContent=hidden?'••••••••':el.dataset.password;
  btn.textContent=hidden?'👁️':'🙈';
}

async function openBag(id){if(!currentUser)return openAuth("login");await refreshUser();if(currentProfile?.banned_until&&new Date(currentProfile.banned_until)>new Date())return showBan();if(siteSettings?.is_closed&&currentProfile?.role!=="admin")return toast("Website đang đóng","danger");let {data,error}=await sb.from("bd_shop_categories").select("*").eq("id",id).single();if(error)return toast(error.message,"danger");openModal(`<div class="modal-head"><h2>🎁 ${esc(data.name)}</h2><button class="close" onclick="closeModal()">×</button></div><p>${esc(data.note||"")}</p><p class="price">${money(data.price)}</p><p class="muted">Hệ thống sẽ chọn ngẫu nhiên 1 acc còn hàng.</p><button class="primary" style="width:100%;padding:14px;border-radius:13px" onclick="openRandom('${id}')">🔥 XÉ NGAY</button>`)}
async function openRandom(categoryId){let {data,error}=await sb.rpc("bd_shop_open_random_account",{p_category_id:categoryId});if(error){let m=error.message.includes("OUT_OF_STOCK")?"Danh mục này đã hết acc.":error.message.includes("INSUFFICIENT_BALANCE")?"Số dư không đủ.":error.message.includes("SITE_CLOSED")?"Website đang đóng.":error.message.includes("BANNED")?"Tài khoản đang bị khóa.":error.message;return toast(m,"danger")}let x=data?.[0];if(!x)return toast("Không nhận được tài khoản","danger");openModal(`<div class="modal-head"><h2>🎉 Xé thành công!</h2></div><div class="result"><p><b>Tài khoản</b></p><div class="cred-row"><div class="credential">${esc(x.username)}</div><div class="cred-actions"><button class="cred-btn" onclick='copyCredential(${JSON.stringify(x.username)})'>📋 Sao chép</button></div></div><p><b>Mật khẩu</b></p><div class="cred-row"><div class="credential password-text is-hidden" data-password="${esc(x.password)}">••••••••</div><div class="cred-actions"><button class="cred-btn" onclick="togglePassword(this)">👁️</button><button class="cred-btn" onclick='copyCredential(${JSON.stringify(x.password)})'>📋</button></div></div><p class="muted">Đã trừ ${money(x.amount)}.</p></div><button class="primary" style="width:100%;padding:13px;border-radius:12px" onclick="closeModal();refreshUser()">Đã nhận</button>`);toast("Xé túi thành công 🎉","success");await refreshUser()}
function openTopup(){if(!currentUser)return openAuth("login");if(siteSettings?.is_closed&&currentProfile?.role!=="admin")return toast("Website đang đóng","danger");openModal(`<div class="modal-head"><h2>💳 Nạp thẻ</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Loại thẻ</label><select id="cardType"><option>Viettel</option><option>VinaPhone</option><option>MobiFone</option><option>Vietnamobile</option><option>Gmobile</option><option>Khác</option></select></div><div class="field"><label>Giá tiền</label><select id="cardValue">${[10000,20000,50000,100000,200000,500000].map(x=>`<option value="${x}">${money(x)}</option>`).join("")}</select></div><div class="field"><label>Serial</label><input id="serial" placeholder="Nhập Serial"></div><div class="field"><label>Mã nạp</label><input id="cardCode" placeholder="Nhập mã thẻ"></div><button class="primary" style="width:100%;padding:13px;border-radius:12px" onclick="submitTopup()">Gửi yêu cầu nạp</button><p class="small muted">Thẻ được gửi cho Admin xử lý thủ công.</p>`)}
async function submitTopup(){let card_type=document.querySelector("#cardType").value,card_value=+document.querySelector("#cardValue").value,serial=document.querySelector("#serial").value.trim(),code=document.querySelector("#cardCode").value.trim();if(!serial||!code)return toast("Nhập Serial và mã nạp","danger");let {error}=await sb.rpc("bd_shop_submit_topup",{p_card_type:card_type,p_card_value:card_value,p_serial:serial,p_code:code});if(error)return toast(error.message,"danger");closeModal();toast("Đã gửi thẻ cho Admin xử lý","success")}
async function openHistory(){if(!currentUser)return openAuth("login");let {data:orders}=await sb.rpc("bd_shop_my_history");let {data:serviceOrders}=await sb.rpc("bd_shop_my_service_orders");let {data:tops}=await sb.from("bd_shop_topups").select("*").eq("user_id",currentUser.id).order("created_at",{ascending:false});let {data:balanceHistory}=await sb.rpc("bd_shop_my_balance_history");openModal(`<div class="modal-head"><h2>📜 Lịch sử</h2><button class="close" onclick="closeModal()">×</button></div><h3>💰 Biến động số dư</h3>${balanceHistory?.length?balanceHistory.map(o=>`<div class="admin-item"><b class="${o.amount>=0?'balance':'price'}">${o.amount>=0?'＋':'－'} ${money(Math.abs(o.amount))}</b><br>${esc(o.note||'Thay đổi số dư')}<br><span class="muted">${new Date(o.created_at).toLocaleString("vi-VN")}</span></div>`).join(""):"<p class='muted'>Chưa có biến động số dư.</p>"}<h3>Đơn đặt dịch vụ</h3>${serviceOrders?.length?serviceOrders.map(o=>`<div class="admin-item"><b>${esc(o.category_name||"Dịch vụ")}</b> · ${esc(o.package_name||"")}<br>Giá: ${money(o.amount)}<br><span class="status ${o.status==='completed'?'success':o.status==='cancelled'?'danger':'warn'}">${o.status==='pending'?'Đang duyệt':o.status==='processing'?'Đang làm':o.status==='completed'?'Hoàn thành':'Đã hủy'}</span>${o.status==='cancelled'?`<br><span class="muted">Đã hoàn ${money(o.amount)}</span>`:""}${o.admin_note?`<br><span class="muted">${esc(o.admin_note)}</span>`:""}<br><span class="muted">${new Date(o.created_at).toLocaleString("vi-VN")}</span></div>`).join(""):"<p class='muted'>Chưa có đơn đặt dịch vụ.</p>"}<h3>Đơn xé</h3>${orders?.length?orders.map(o=>`<div class="admin-item"><b>${esc(o.category_name||"Danh mục")}</b><div class="cred-row"><span>Tài khoản:</span><div class="credential"><code>${esc(o.username)}</code></div><div class="cred-actions"><button class="cred-btn" onclick='copyCredential(${JSON.stringify(o.username)})'>📋</button></div></div><div class="cred-row"><span>Mật khẩu:</span><div class="credential password-text is-hidden" data-password="${esc(o.password)}">••••••••</div><div class="cred-actions"><button class="cred-btn" onclick="togglePassword(this)">👁️</button><button class="cred-btn" onclick='copyCredential(${JSON.stringify(o.password)})'>📋</button></div></div>${money(o.amount)} · ${new Date(o.created_at).toLocaleString("vi-VN")}</div>`).join(""):"<p class='muted'>Chưa có đơn xé.</p>"}<h3>Nạp thẻ</h3>${tops?.length?tops.map(o=>`<div class="admin-item"><b>${esc(o.card_type)}</b> · ${money(o.card_value)}<br>Serial: <code>${esc(o.serial)}</code><br>Mã: <code>${esc(o.card_code)}</code><br><span class="status ${o.status==='success'?'success':o.status==='rejected'?'danger':'warn'}">${o.status==='success'?'Thành công':o.status==='rejected'?'Từ chối':'Đang duyệt'}</span>${o.admin_note?`<br><span class="muted">${esc(o.admin_note)}</span>`:""}</div>`).join(""):"<p class='muted'>Chưa có yêu cầu nạp.</p>"}`)}
function openProfile(){openModal(`<div class="modal-head"><h2>👤 Tài khoản</h2><button class="close" onclick="closeModal()">×</button></div><p>Tên: <b>${esc(currentProfile?.username)}</b></p><p>ID: <code>${currentUser.id}</code></p><p>Số dư: <b class="balance">${money(currentProfile?.balance)}</b></p><p class="small muted">Tài khoản thuộc BD Roblox Shop mới.</p>`)}
function openZalo(){openModal(`<div class="modal-head"><h2>💬 Zalo</h2><button class="close" onclick="closeModal()">×</button></div><p style="text-align:center">Quét mã QR để kết nối Zalo.</p><img class="qr" src="data:image/webp;base64,${QR_DATA}" alt="Zalo QR"><p class="small muted" style="text-align:center">QR lấy từ ảnh Zalo bạn đã gửi.</p>`)}
async function openAdmin(){if(currentProfile?.role!=="admin")return toast("Không có quyền","danger");document.querySelector("#shop").classList.add("hidden");let a=document.querySelector("#admin");a.classList.remove("hidden");a.innerHTML=`<div class="hero"><h1>⚙ Admin Dashboard</h1><p>Quản lý shop, acc, nạp thẻ, người dùng và đóng/mở website.</p></div><div class="tabs"><button class="active" onclick="adminTab('cats',this)">Danh mục</button><button onclick="adminTab('tops',this)">Nạp thẻ</button><button onclick="adminTab('users',this)">Tài khoản</button><button onclick="adminTab('orders',this)">Đơn hàng</button><button onclick="adminTab('site',this)">Website</button></div><div id="adminContent"></div>`;adminTab("cats",document.querySelector(".tabs button"))}
async function adminTab(tab,btn){
 if(tab==='serviceorders') tab='orders';
 if(tab==='servicecats') tab='cats';
 document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));btn.classList.add("active");
 let c=document.querySelector("#adminContent");
 if(tab==='cats'){
  let {data,error}=await sb.from("bd_shop_categories").select("*").order("created_at",{ascending:false});
  if(error){c.innerHTML=`<p>${esc(error.message)}</p>`;return}
  let rows=(data||[]).map(x=>`<div class="admin-item"><div class="row"><div><b>${esc(x.name)}</b><br><span class="price">${money(x.price)}</span><br><span class="muted">${esc(x.note||"")}</span></div><div class="actions"><button onclick="editCategory('${x.id}')">Sửa</button><button onclick="manageCategory('${x.id}')">Acc</button></div></div></div>`).join("");
  let {data:svc}=await sb.from("bd_shop_order_categories").select("*").order("created_at",{ascending:false});
  let srows=(svc||[]).map(x=>`<div class="admin-item"><div class="row"><div><b>🧾 ${esc(x.name)}</b><br><span class="muted">${esc(x.description||"")}</span></div><div class="actions"><button onclick="editServiceCategory('${x.id}')">Sửa</button><button onclick="manageServicePackages('${x.id}')">Gói giá</button></div></div></div>`).join("");
  c.innerHTML=`<h3>🎁 Túi mù</h3><div class="actions"><button class="primary" onclick="newCategory()">＋ Thêm danh mục</button></div>${rows||"<p>Chưa có danh mục.</p>"}<h3 style="margin-top:28px">🧾 Đặt đơn</h3><div class="actions"><button class="primary" onclick="newServiceCategory()">＋ Thêm dịch vụ</button></div>${srows||"<p>Chưa có dịch vụ.</p>"}`;
 }else if(tab==='tops'){
  let {data,error}=await sb.rpc("bd_shop_admin_topups");
  if(error){c.innerHTML=`<p>${esc(error.message)}</p>`;return}
  const topupStatus={pending:["Đang duyệt","warn"],success:["Thành công","success"],rejected:["Từ chối","danger"]};
  c.innerHTML=(data||[]).map(x=>{let q=topupStatus[x.status]||[x.status,""];return `<div class="admin-item"><b>${esc(x.username||x.user_id)}</b> · ${esc(x.card_type)} · ${money(x.card_value)}<br>Serial: <code>${esc(x.serial)}</code><br>Mã: <code>${esc(x.card_code)}</code><br><span class="status ${q[1]}">${esc(q[0])}</span>${x.admin_note?`<br><span class="muted">${esc(x.admin_note)}</span>`:""}${x.status==='pending'?`<div class="actions"><button onclick="processTopup('${x.id}',true)">Duyệt</button><button class="danger-btn" onclick="processTopup('${x.id}',false)">Từ chối</button></div>`:""}</div>`}).join("")||"<p>Không có yêu cầu.</p>";
 }else if(tab==='users'){
  let {data,error}=await sb.from("bd_shop_profiles").select("*").order("created_at",{ascending:false});
  if(error){c.innerHTML=`<p>${esc(error.message)}</p>`;return}
  c.innerHTML=(data||[]).map(x=>`<div class="admin-item"><div class="row"><div><b>${esc(x.username)}</b> <span class="status">${esc(x.role)}</span><br><span class="small">${x.id}</span><br>Số dư: ${money(x.balance)}${x.banned_until&&new Date(x.banned_until)>new Date()?`<br><span class="status danger">Đang bị khóa</span>`:""}</div><div class="actions"><button onclick="adjustBalance('${x.id}','${esc(x.username)}','add')">＋ Tiền</button><button onclick="adjustBalance('${x.id}','${esc(x.username)}','sub')">－ Tiền</button><button onclick="banUser('${x.id}')">🚫 Ban</button></div></div></div>`).join("")||"<p>Chưa có tài khoản.</p>";
 }else if(tab==='orders'){
  let {data:svc,error:svcError}=await sb.from("bd_shop_order_categories").select("*").order("created_at",{ascending:false});
  if(svcError){c.innerHTML=`<p>${esc(svcError.message)}</p>`;return}
  let serviceRows=(svc||[]).map(x=>`<div class="admin-item"><div class="row"><div><b>🧾 ${esc(x.name)}</b><br><span class="muted">${esc(x.description||"")}</span></div><div class="actions"><button onclick="editServiceCategory('${x.id}')">Sửa</button><button onclick="manageServicePackages('${x.id}')">Gói giá</button></div></div></div>`).join("");
  let {data,error}=await sb.rpc("bd_shop_admin_service_orders");
  if(error){c.innerHTML=`<h3>🧾 Danh mục đặt đơn</h3><div class="actions"><button class="primary" onclick="newServiceCategory()">＋ Tạo danh mục đặt đơn</button></div>${serviceRows||"<p>Chưa có danh mục đặt đơn.</p>"}<hr style="margin:28px 0;border:0;border-top:1px solid #ddd"><h3>📦 Đơn hàng khách</h3><p>${esc(error.message)}</p>`;return}
  const st={pending:["Đang duyệt (Pending)","warn"],processing:["Đang làm (Processing)","warn"],completed:["Hoàn thành (Completed)","success"],cancelled:["Đã hủy (Cancelled)","danger"]};
  let orderRows=(data||[]).map(x=>{let q=st[x.status]||[x.status,""];return `<div class="admin-item"><b>${esc(x.username||x.user_id)}</b> · ${esc(x.category_name||"Dịch vụ")}<br>Gói: ${esc(x.package_name||"")}<br>TK: <code>${esc(x.account)}</code><br>MK: <code>${esc(x.password)}</code>${x.content?`<br>Nội dung: ${esc(x.content)}`:""}<br>Giá: <span class="price">${money(x.amount)}</span><br><span class="status ${q[1]}">${esc(q[0])}</span><div class="actions"><button onclick="adminSetServiceStatus('${x.id}','processing')">Đang làm</button><button onclick="adminSetServiceStatus('${x.id}','completed')">Hoàn thành</button><button class="danger-btn" onclick="adminSetServiceStatus('${x.id}','cancelled')">Đã hủy</button></div>${x.admin_note?`<span class="muted">${esc(x.admin_note)}</span>`:""}</div>`}).join("");
  c.innerHTML=`<h3>🧾 Danh mục đặt đơn</h3><div class="actions"><button class="primary" onclick="newServiceCategory()">＋ Tạo danh mục đặt đơn</button></div>${serviceRows||"<p>Chưa có danh mục đặt đơn.</p>"}<hr style="margin:28px 0;border:0;border-top:1px solid #ddd"><h3>📦 Đơn hàng khách</h3>${orderRows||"<p>Chưa có đơn hàng.</p>"}`;
 }else{
  c.innerHTML=`<div class="admin-item"><h3>Trạng thái website</h3><p class="muted">Hiện tại: <b>${siteSettings?.is_closed?'🔒 ĐANG ĐÓNG':'🟢 ĐANG MỞ'}</b></p><div style="display:flex;gap:10px;flex-wrap:wrap;margin:12px 0"><button class="primary" onclick="setSiteState(false)">🟢 MỞ WEBSITE</button><button class="danger" onclick="setSiteState(true)">🔒 ĐÓNG WEBSITE</button></div><div class="field"><label>Thông báo khi đóng</label><textarea id="siteMsg">${esc(siteSettings?.message||'Website đang tạm đóng để bảo trì.')}</textarea></div></div><div class="admin-item"><h3>🎨 Cấu hình giao diện</h3><p class="muted">Nhập link ảnh. Để trống sẽ giữ giao diện mặc định.</p><div class="field"><label>Tên website / Title</label><input id="cfgTitle" value="${esc(siteSettings?.site_title||'')}" placeholder="BD Roblox Shop"></div><div class="field"><label>🖼️ Banner</label><input id="cfgBanner" value="${esc(siteSettings?.banner_url||'')}" placeholder="https://.../banner.jpg"></div><div class="field"><label>⭐ Logo custom</label><input id="cfgLogo" value="${esc(siteSettings?.logo_url||'')}" placeholder="https://.../logo.png"></div><div class="field"><label>🌐 Favicon</label><input id="cfgFavicon" value="${esc(siteSettings?.favicon_url||'')}" placeholder="https://.../favicon.png"></div><button class="primary" style="width:100%;padding:13px;border-radius:12px" onclick="saveSiteConfig()">💾 Lưu cấu hình</button></div>`;
 }
}
function newServiceCategory(){openModal(`<div class="modal-head"><h2>＋ Dịch vụ mới</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Tên dịch vụ</label><input id="scn" placeholder="Buff TT Roblox"></div><div class="field"><label>Link ảnh</label><input id="sci" placeholder="https://..."></div><div class="field"><label>Mô tả / nội dung</label><textarea id="sco"></textarea></div><button class="primary" style="width:100%;padding:13px;border-radius:12px" onclick="saveServiceCategory()">Tạo dịch vụ</button>`)}
async function saveServiceCategory(){let o={name:document.querySelector('#scn').value.trim(),image_url:document.querySelector('#sci').value.trim()||null,description:document.querySelector('#sco').value.trim()||null,price:1};if(!o.name)return toast('Nhập tên dịch vụ','danger');let {error}=await sb.from('bd_shop_order_categories').insert(o);if(error)return toast(error.message,'danger');closeModal();toast('Đã tạo dịch vụ','success');openAdmin()}
async function editServiceCategory(id){let {data:c,error}=await sb.from('bd_shop_order_categories').select('*').eq('id',id).single();if(error)return toast(error.message,'danger');openModal(`<div class="modal-head"><h2>✏️ Sửa dịch vụ</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Tên dịch vụ</label><input id="scn" value="${esc(c.name)}"></div><div class="field"><label>Link ảnh</label><input id="sci" value="${esc(c.image_url||'')}"></div><div class="field"><label>Mô tả</label><textarea id="sco">${esc(c.description||'')}</textarea></div><label class="switch"><input id="sca" type="checkbox" ${c.active?'checked':''}> Hiển thị</label><button class="primary" style="width:100%;padding:13px;border-radius:12px;margin-top:12px" onclick="updateServiceCategory('${id}')">Lưu</button>`)}
async function updateServiceCategory(id){let {error}=await sb.from('bd_shop_order_categories').update({name:document.querySelector('#scn').value.trim(),image_url:document.querySelector('#sci').value.trim()||null,description:document.querySelector('#sco').value.trim()||null,active:document.querySelector('#sca').checked}).eq('id',id);if(error)return toast(error.message,'danger');closeModal();toast('Đã cập nhật','success');openAdmin()}
async function manageServicePackages(id){let {data:c}=await sb.from('bd_shop_order_categories').select('*').eq('id',id).single();let {data:p,error}=await sb.from('bd_shop_order_packages').select('*').eq('category_id',id).order('price');if(error)return toast(error.message,'danger');openModal(`<div class="modal-head"><h2>💰 ${esc(c.name)}</h2><button class="close" onclick="closeModal()">×</button></div><button class="primary" style="padding:11px 14px;border-radius:12px" onclick="addServicePackage('${id}')">＋ Thêm gói</button><div style="margin-top:15px">${(p||[]).map(x=>`<div class="admin-item"><div class="row"><div><b>${esc(x.name)}</b><br><span class="price">${money(x.price)}</span></div><button onclick="deleteServicePackage('${x.id}','${id}')">Xóa</button></div></div>`).join('')||"<p class='muted'>Chưa có gói.</p>"}</div>`)}
function addServicePackage(id){openModal(`<div class="modal-head"><h2>＋ Thêm gói</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Tên gói</label><input id="spn" placeholder="1K TT"></div><div class="field"><label>Giá</label><input id="spp" type="number" placeholder="500000"></div><button class="primary" style="width:100%;padding:13px;border-radius:12px" onclick="saveServicePackage('${id}')">Thêm gói</button>`)}
async function saveServicePackage(id){let name=document.querySelector('#spn').value.trim(),price=+document.querySelector('#spp').value;if(!name||price<=0)return toast('Nhập tên và giá','danger');let {error}=await sb.from('bd_shop_order_packages').insert({category_id:id,name,price});if(error)return toast(error.message,'danger');toast('Đã thêm gói','success');manageServicePackages(id)}
async function deleteServicePackage(pid,cid){if(!confirm('Xóa gói này?'))return;let {error}=await sb.from('bd_shop_order_packages').delete().eq('id',pid);if(error)return toast(error.message,'danger');toast('Đã xóa','success');manageServicePackages(cid)}
async function adminSetServiceStatus(id,status){let note=status==='cancelled'?'Đơn đã bị hủy':status==='completed'?'Đơn đã hoàn thành':'Đơn đang được xử lý';let {error}=await sb.rpc('bd_shop_admin_set_service_order_status',{p_order_id:id,p_status:status,p_note:note});if(error)return toast(error.message,'danger');toast('Đã cập nhật đơn','success');adminTab('orders',document.querySelector('.tabs button:nth-child(4)'))}
function newCategory(){openModal(`<div class="modal-head"><h2>＋ Danh mục mới</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Tên</label><input id="cn" placeholder="Túi mù 99K"></div><div class="field"><label>Giá</label><input id="cp" type="number" value="99000"></div><div class="field"><label>Link ảnh</label><input id="ci" placeholder="https://..."></div><div class="field"><label>Ghi chú</label><textarea id="co"></textarea></div><button class="primary" style="width:100%;padding:13px;border-radius:12px" onclick="saveCategory()">Tạo danh mục</button>`)}
async function saveCategory(){let o={name:document.querySelector('#cn').value.trim(),price:+document.querySelector('#cp').value,image_url:document.querySelector('#ci').value.trim()||null,note:document.querySelector('#co').value.trim()||null};if(!o.name||!o.price)return toast('Nhập đủ tên và giá','danger');let {error}=await sb.from('bd_shop_categories').insert(o);if(error)return toast(error.message,'danger');closeModal();toast('Đã tạo danh mục','success');openAdmin();loadCategories()}
async function editCategory(id){let {data:c,error}=await sb.from('bd_shop_categories').select('*').eq('id',id).single();if(error)return toast(error.message,'danger');openModal(`<div class="modal-head"><h2>✏️ Sửa danh mục</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Tên</label><input id="cn" value="${esc(c.name)}"></div><div class="field"><label>Giá</label><input id="cp" type="number" value="${c.price}"></div><div class="field"><label>Link ảnh</label><input id="ci" value="${esc(c.image_url||'')}"></div><div class="field"><label>Ghi chú</label><textarea id="co">${esc(c.note||'')}</textarea></div><label class="switch"><input id="ca" type="checkbox" ${c.active?'checked':''}> Hiển thị</label><br><button class="primary" style="width:100%;padding:13px;border-radius:12px;margin-top:12px" onclick="updateCategory('${id}')">Lưu</button>`)}
async function updateCategory(id){let {error}=await sb.from('bd_shop_categories').update({name:document.querySelector('#cn').value.trim(),price:+document.querySelector('#cp').value,image_url:document.querySelector('#ci').value.trim()||null,note:document.querySelector('#co').value.trim()||null,active:document.querySelector('#ca').checked}).eq('id',id);if(error)return toast(error.message,'danger');closeModal();toast('Đã cập nhật','success');openAdmin();loadCategories()}
async function manageCategory(id){let {data:c}=await sb.from('bd_shop_categories').select('*').eq('id',id).single();let {data:a}=await sb.from('bd_shop_accounts').select('*').eq('category_id',id).order('created_at',{ascending:false});openModal(`<div class="modal-head"><h2>📦 ${esc(c.name)}</h2><button class="close" onclick="closeModal()">×</button></div><p>${money(c.price)} · ${esc(c.note||'')}</p><button class="primary" style="padding:11px 14px;border-radius:12px" onclick="addAccount('${id}')">＋ Thêm acc</button><div style="margin-top:15px">${(a||[]).map(x=>`<div class="admin-item"><b>${esc(x.username)}</b><br><span class="muted">Mật khẩu: ${esc(x.password)}</span><br><span class="status ${x.sold?'danger':'success'}">${x.sold?'Đã xé':'Còn hàng'}</span>${!x.sold?` <button onclick="deleteAccount('${x.id}','${id}')">Xóa</button>`:''}</div>`).join('')||"<p class='muted'>Chưa có acc.</p>"}</div>`)}
function addAccount(id){openModal(`<div class="modal-head"><h2>＋ Thêm acc</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Tài khoản Roblox</label><input id="au"></div><div class="field"><label>Mật khẩu</label><input id="ap"></div><button class="primary" style="width:100%;padding:13px;border-radius:12px" onclick="saveAccount('${id}')">Thêm acc</button>`)}
async function saveAccount(id){let username=document.querySelector('#au').value.trim(),password=document.querySelector('#ap').value;if(!username||!password)return toast('Nhập đủ tài khoản và mật khẩu','danger');let {error}=await sb.from('bd_shop_accounts').insert({category_id:id,username,password});if(error)return toast(error.message,'danger');toast('Đã thêm acc','success');manageCategory(id)}
async function deleteAccount(accountId,catId){if(!confirm('Xóa acc này?'))return;let {error}=await sb.from('bd_shop_accounts').delete().eq('id',accountId).eq('sold',false);if(error)return toast(error.message,'danger');toast('Đã xóa','success');manageCategory(catId)}
async function processTopup(id,approve){let {error}=await sb.rpc('bd_shop_admin_process_topup',{p_topup_id:id,p_approve:approve,p_note:approve?'Đã duyệt':'Admin từ chối'});if(error)return toast(error.message,'danger');toast(approve?'Đã cộng tiền':'Đã từ chối','success');openAdmin()}
function adjustBalance(userId,username,mode){openModal(`<div class="modal-head"><h2>${mode==='add'?'＋ Cộng tiền':'－ Trừ tiền'}</h2><button class="close" onclick="closeModal()">×</button></div><p>Tài khoản: <b>${esc(username)}</b></p><div class="field"><label>Số tiền</label><input id="adjAmount" type="number" min="1" placeholder="100000"></div><div class="field"><label>Ghi chú</label><textarea id="adjNote" placeholder="Ví dụ: Hoàn tiền / hỗ trợ khách"></textarea></div><button class="primary" style="width:100%;padding:13px;border-radius:12px" onclick="submitBalanceAdjust('${userId}','${mode}')">Xác nhận</button>`)}
async function submitBalanceAdjust(userId,mode){let amount=Math.floor(+document.querySelector('#adjAmount').value),note=document.querySelector('#adjNote').value.trim();if(!Number.isFinite(amount)||amount<=0)return toast('Nhập số tiền hợp lệ','danger');if(!note)note=mode==='add'?'Admin cộng tiền':'Admin trừ tiền';let signed=mode==='add'?amount:-amount;let {error}=await sb.rpc('bd_shop_admin_adjust_balance',{p_user_id:userId,p_amount:signed,p_note:note});if(error)return toast(error.message,'danger');closeModal();toast(mode==='add'?'Đã cộng tiền':'Đã trừ tiền','success');await refreshUser();openAdmin()}
function banUser(id){openModal(`<div class="modal-head"><h2>🚫 Ban tài khoản</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Ngày</label><input id="bd" type="number" value="7"></div><div class="field"><label>Giờ</label><input id="bh" type="number" value="0"></div><div class="field"><label>Phút</label><input id="bm" type="number" value="0"></div><div class="field"><label>Giây</label><input id="bs" type="number" value="0"></div><div class="field"><label>Nội dung</label><textarea id="bmsg">Tài khoản của bạn đã bị khóa.</textarea></div><button class="primary" style="width:100%;padding:13px;border-radius:12px" onclick="doBan('${id}')">Ban tài khoản</button>`)}
async function doBan(id){let seconds=((+document.querySelector('#bd').value||0)*86400)+((+document.querySelector('#bh').value||0)*3600)+((+document.querySelector('#bm').value||0)*60)+(+document.querySelector('#bs').value||0);let {error}=await sb.rpc('bd_shop_admin_ban_user',{p_user_id:id,p_seconds:seconds,p_message:document.querySelector('#bmsg').value});if(error)return toast(error.message,'danger');closeModal();toast('Đã ban tài khoản','success');openAdmin()}
function applySiteConfig(){const title=siteSettings?.site_title?.trim();document.title=title||'BD Roblox Shop';const pt=document.querySelector('#pageTitle');if(pt)pt.textContent=title||'BD Roblox Shop';const hero=document.querySelector('#siteHero');if(hero){if(siteSettings?.banner_url?.trim()){hero.style.backgroundImage=`linear-gradient(135deg,#0007,#c71919aa),url("${siteSettings.banner_url.replace(/\"/g,'') }")`;hero.style.backgroundSize='cover';hero.style.backgroundPosition='center'}else{hero.style.backgroundImage=''}}const logo=document.querySelector('#customLogo'),logoText=document.querySelector('#logoText');if(logo){if(siteSettings?.logo_url?.trim()){logo.src=siteSettings.logo_url;logo.style.display='block';if(logoText)logoText.style.display='none'}else{logo.removeAttribute('src');logo.style.display='none';if(logoText)logoText.style.display='inline'}}const fav=document.querySelector('#siteFavicon');if(fav)fav.href=siteSettings?.favicon_url?.trim()||'data:,'}async function saveSiteConfig(){let payload={site_title:document.querySelector('#cfgTitle')?.value.trim()||null,banner_url:document.querySelector('#cfgBanner')?.value.trim()||null,logo_url:document.querySelector('#cfgLogo')?.value.trim()||null,favicon_url:document.querySelector('#cfgFavicon')?.value.trim()||null};let {error}=await sb.from('bd_shop_settings').update(payload).eq('id',1);if(error)return toast('Chưa lưu được cấu hình: '+error.message,'danger');await loadSiteSettings();applySiteConfig();toast('Đã lưu cấu hình website 🎨','success');openAdmin()}async function setSiteState(closed){let msg=document.querySelector('#siteMsg')?.value||siteSettings?.message||'Website đang tạm đóng để bảo trì.';let {error}=await sb.rpc('bd_shop_admin_set_site',{p_closed:closed,p_message:msg});if(error)return toast(error.message,'danger');await loadSiteSettings();applySiteConfig();toast(closed?'Đã đóng website 🔒':'Đã mở website 🟢','success');openAdmin()}

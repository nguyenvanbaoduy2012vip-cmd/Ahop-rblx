<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nạp thẻ - BD Roblox Shop</title><style>body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;color:#111}.box{max-width:520px;margin:40px auto;background:#fff;padding:24px;border-radius:18px;box-shadow:0 8px 30px #0001}h1{margin-top:0}.field{margin:14px 0}label{display:block;font-weight:700;margin-bottom:7px}input,select,button{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:15px}button{background:#111;color:#fff;border:0;font-weight:700;cursor:pointer;margin-top:8px}.back{background:#eee;color:#111}.muted{color:#777;font-size:13px}.msg{margin-top:12px;padding:10px;border-radius:10px}.ok{background:#e8f7e8}.err{background:#ffe9e9}</style></head><body><main class="box"><h1>💳 Nạp thẻ</h1><p class="muted">Nạp tiền vào tài khoản BD Roblox Shop. Thẻ sẽ được Admin kiểm tra thủ công.</p><div class="field"><label>Loại thẻ</label><select id="cardType"><option>Viettel</option><option>VinaPhone</option><option>MobiFone</option><option>Card VNG</option><option>Card Garena</option><option>Khác</option></select></div><div class="field"><label>Giá tiền</label><select id="cardValue"><option value="10000">10.000đ</option><option value="20000">20.000đ</option><option value="50000">50.000đ</option><option value="100000">100.000đ</option><option value="200000">200.000đ</option><option value="500000">500.000đ</option></select></div><div class="field"><label>Serial</label><input id="serial" placeholder="Nhập Serial"></div><div class="field"><label>Mã nạp</label><input id="cardCode" placeholder="Nhập mã thẻ"></div><button onclick="submitTopup()">Gửi yêu cầu nạp</button><button class="back" onclick="location.href='index.html'">← Quay lại Shop</button><div id="msg"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL="https://rnbjhfnjyxfpskdszdwi.supabase.co",SUPABASE_PUBLISHABLE_KEY="sb_publishable_JRRtyQgA8xEuR3skPoigDA_Jo-68s-L",sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const msg=(x,c)=>document.querySelector('#msg').innerHTML=`<div class="msg ${c}">${x}</div>`;(async()=>{const {data:{user}}=await sb.auth.getUser();if(!user){location.href='index.html';return}})();async function submitTopup(){const {data:{user}}=await sb.auth.getUser();if(!user)return location.href='index.html';const card_type=document.querySelector('#cardType').value,card_value=+document.querySelector('#cardValue').value,serial=document.querySelector('#serial').value.trim(),code=document.querySelector('#cardCode').value.trim();if(!serial||!code)return msg('Nhập đầy đủ Serial và mã nạp.','err');const {error}=await sb.rpc('bd_shop_submit_topup',{p_card_type:card_type,p_card_value:card_value,p_serial:serial,p_code:code});if(error)return msg(error.message,'err');msg('Đã gửi thẻ cho Admin xử lý.','ok');document.querySelector('#serial').value='';document.querySelector('#cardCode').value='';}</script></body></html>
